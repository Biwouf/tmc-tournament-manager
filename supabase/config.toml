[functions.contact-form]
# Formulaire public : les visiteurs n’ont pas de session utilisateur.
verify_jwt = false

[auth.email]
# PWA : accès membre accordé par un admin, sans confirmation par email.
# Reproduire ce réglage dans Authentication > Providers > Email du projet hébergé.
enable_confirmations = false

[functions.send-auth-email]
# Signature Standard Webhooks vérifiée dans la fonction ; pas de JWT utilisateur.
verify_jwt = false

[functions.club-signup]
# Inscription publique d'un club : Turnstile et limite de débit dans la fonction, pas de session.
verify_jwt = false
